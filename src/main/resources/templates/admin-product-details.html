<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin - Product Details')}"></head>
<body>
<div th:replace="~{fragments :: adminNavbar}"></div>

<main class="container" style="margin-top: 28px;">
    <div th:replace="~{fragments :: alerts}"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <a th:href="@{/admin/dashboard}" class="btn btn-outline btn-sm">&larr; Back to Admin Dashboard</a>
        <a th:href="@{/admin/dashboard(editId=${product.id})}" class="btn btn-primary btn-sm">Edit This Product</a>
    </div>

    <div class="card grid-2" style="align-items:start;">
        <div>
            <img th:src="${product.imageUrl}" th:alt="${product.name}"
                 style="width:100%; max-height:400px; object-fit:cover; border-radius:10px; border:1px solid var(--border);">
        </div>
        <div>
            <span class="badge badge-confirmed" th:text="${product.category != null ? product.category.name : 'Uncategorized'}">Category</span>
            <span th:if="${product.featured}" class="badge badge-pending">Featured on Homepage</span>

            <h1 style="font-size: 1.9rem; margin: 10px 0;" th:text="${product.name}">Product Name</h1>
            <p style="color: var(--muted); font-size:0.9rem; margin-bottom: 14px;"
               th:text="'Product ID: #' + ${product.id} + ' | Added on: ' + ${#temporals.format(product.createdAt, 'dd MMM yyyy, hh:mm a')}">Meta</p>

            <div style="font-size: 1.7rem; font-weight: 800; color: var(--primary); margin-bottom: 16px;"
                 th:text="'₹' + ${#numbers.formatDecimal(product.price, 1, 2)}">₹0.00</div>

            <div style="background:#f8fafc; padding:14px; border-radius:8px; border:1px solid var(--border); margin-bottom:18px;">
                <strong>Current Stock Level: </strong>
                <span th:text="${product.stock} + ' units'">0 units</span>
                <form th:action="@{/admin/products/stock}" method="post" style="display:flex; gap:8px; margin-top:10px;">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="number" name="stock" th:value="${product.stock}" min="0" class="form-control" style="max-width:120px;">
                    <button type="submit" class="btn btn-primary btn-sm">Update Stock</button>
                </form>
            </div>

            <h4>Product Description</h4>
            <p style="margin-top:6px; white-space: pre-line; color:var(--text);"
               th:text="${product.description != null && !product.description.isEmpty() ? product.description : 'No description provided.'}">Description</p>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
