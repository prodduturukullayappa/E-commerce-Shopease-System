<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Customer Registration')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="card auth-box">
        <h2 style="margin-bottom: 8px;">Create Customer Account</h2>
        <p style="color: var(--muted); margin-bottom: 20px;">Register to start shopping and tracking your orders</p>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required placeholder="John Doe">
                <small style="color:var(--danger);" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
            </div>
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required placeholder="john@example.com">
                <small style="color:var(--danger);" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="9876543210">
            </div>
            <div class="form-group">
                <label for="address">Default Delivery Address</label>
                <textarea id="address" th:field="*{address}" rows="2" class="form-control" placeholder="Street, City, State, PIN"></textarea>
            </div>
            <div class="form-group">
                <label for="newPassword">Password (min 6 characters) *</label>
                <input type="password" id="newPassword" th:field="*{password}" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required minlength="6">
                <small id="passwordMatchHint" style="display:block; margin-top:4px; font-weight:600;"></small>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Register Customer Account</button>
        </form>

        <p style="margin-top: 18px; text-align: center; font-size: 0.92rem;">
            Already registered? <a th:href="@{/login}" style="color: var(--primary); font-weight: 600;">Customer Login</a>
        </p>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
