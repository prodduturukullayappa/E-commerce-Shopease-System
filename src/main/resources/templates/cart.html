<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Shopping Cart')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="section-header">
        <h2>Your Shopping Cart</h2>
        <a th:href="@{/products}" class="btn btn-outline btn-sm">Continue Shopping</a>
    </div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-state">
        <h3>Your cart is currently empty</h3>
        <p style="margin-bottom: 18px;">Explore our catalog and add items to your cart.</p>
        <a th:href="@{/products}" class="btn btn-primary">Shop Now</a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}" class="cart-layout">
        <div class="card table-responsive" style="padding: 0; overflow: hidden;">
            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <img th:src="${item.product.imageUrl}" alt="Product" style="width:56px; height:56px; object-fit:cover; border-radius:6px;">
                            <div>
                                <a th:href="@{/products/{id}(id=${item.product.id})}" style="font-weight:700;" th:text="${item.product.name}">Name</a>
                                <div style="font-size:0.8rem; color:var(--muted);" th:text="'Stock: ' + ${item.product.stock}">Stock</div>
                            </div>
                        </div>
                    </td>
                    <td th:text="'₹' + ${#numbers.formatDecimal(item.product.price, 1, 2)}">₹0.00</td>
                    <td>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <form th:action="@{/cart/update}" method="post">
                                <input type="hidden" name="itemId" th:value="${item.id}">
                                <input type="hidden" name="delta" value="-1">
                                <button type="submit" class="btn btn-outline btn-sm">-</button>
                            </form>
                            <span style="font-weight:700; min-width:24px; text-align:center;" th:text="${item.quantity}">1</span>
                            <form th:action="@{/cart/update}" method="post">
                                <input type="hidden" name="itemId" th:value="${item.id}">
                                <input type="hidden" name="delta" value="1">
                                <button type="submit" class="btn btn-outline btn-sm">+</button>
                            </form>
                        </div>
                    </td>
                    <td style="font-weight:700;" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">₹0.00</td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 16px;">Cart Summary</h3>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Subtotal</span>
                <span th:text="'₹' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">₹0.00</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Shipping</span>
                <span style="color:var(--success); font-weight:600;">FREE</span>
            </div>
            <hr style="border:none; border-top:1px solid var(--border); margin:14px 0;">
            <div style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:800; margin-bottom:20px;">
                <span>Total</span>
                <span style="color:var(--primary);" th:text="'₹' + ${#numbers.formatDecimal(cartTotal, 1, 2)}">₹0.00</span>
            </div>
            <a th:href="@{/checkout}" class="btn btn-primary" style="width:100%;">Proceed to Checkout &amp; Payment</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
