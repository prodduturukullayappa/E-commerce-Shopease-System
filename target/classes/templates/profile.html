<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Profile')}"></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<main class="container">
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="section-header">
        <h2>Account Settings</h2>
    </div>

    <div class="grid-2">
        <div class="card">
            <h3 style="margin-bottom: 16px;">Update Profile</h3>
            <form th:action="@{/profile/update}" method="post">
                <div class="form-group">
                    <label>Email Address (Read-only)</label>
                    <input type="email" th:value="${user.email}" class="form-control" readonly style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" th:value="${user.fullName}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" th:value="${user.phone}" class="form-control">
                </div>
                <div class="form-group">
                    <label for="address">Default Delivery Address</label>
                    <textarea id="address" name="address" rows="3" class="form-control" th:text="${user.address}"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 16px;">Change Password</h3>
            <form th:action="@{/profile/password}" method="post">
                <div class="form-group">
                    <label for="currentPassword">Current Password *</label>
                    <input type="password" id="currentPassword" name="currentPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password (min 6 chars) *</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required minlength="6">
                    <small id="passwordMatchHint" style="display:block; margin-top:4px; font-weight:600;"></small>
                </div>
                <button type="submit" class="btn btn-accent">Update Password</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
